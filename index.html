<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Teamlage">
  <meta name="theme-color" content="#08110f">
  <meta name="description" content="Taktisches Lageboard für Team-Status, Timer und Kartenmarkierungen. Läuft mit eigenem Geländeplan komplett offline, oder mit Live-Karte (OpenStreetMap) wenn online – und danach weiter mit den zuletzt geladenen Kartenausschnitten offline.">
  <title>Teamlage Offline</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- Leaflet wird nur für den optionalen Live-Karten-Modus geladen (OpenStreetMap-Kacheln).
       Beim ersten Online-Aufruf lädt der Service Worker diese Dateien in den Cache,
       danach funktioniert auch dieser Teil ohne Internetverbindung. Der Modus
       "Eigenes Bild" benötigt zu keinem Zeitpunkt eine Internetverbindung. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>/* Vollstaendig lokal ausser Live-Karten-Modus (siehe Kommentar oben). */

:root {
  --ink: #eaf3ef;
  --muted: #95aaa2;
  --muted-2: #6f837c;
  --line: rgba(221, 239, 232, 0.12);
  --line-strong: rgba(221, 239, 232, 0.2);
  --accent: #8dd0aa;
  --accent-strong: #b8eccd;
  --danger: #ff806c;
  --warning: #e9b949;
}

* { box-sizing: border-box; }

html,
body {
  min-height: 100%;
  margin: 0;
  background: #08110f;
  color: var(--ink);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
}

button,
input,
textarea { font: inherit; }
button { color: inherit; }
button, .map-team { -webkit-tap-highlight-color: transparent; }

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent-strong);
  outline-offset: 3px;
}

.app-shell {
  height: 100dvh;
  min-height: 620px;
  overflow: hidden;
  background: radial-gradient(circle at 50% -20%, rgba(77, 132, 106, 0.18), transparent 42%), #08110f;
}

.topbar {
  height: 82px;
  display: grid;
  grid-template-columns: minmax(230px, 0.8fr) minmax(480px, 1.5fr) minmax(230px, 0.8fr);
  align-items: center;
  gap: 22px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(9, 19, 16, 0.96);
  position: relative;
  z-index: 30;
  transition: background 180ms ease, box-shadow 180ms ease;
}

.topbar.timer-due {
  background: #351410;
  box-shadow: inset 0 -3px 0 #ff765f;
  animation: duePulse 1.15s ease-in-out infinite;
}

@keyframes duePulse {
  50% { box-shadow: inset 0 -3px 0 #ff765f, 0 0 34px rgba(255, 91, 68, 0.24); }
}

.brand-block,
.top-actions,
.timer-strip,
.timer-actions,
.toolbar-group,
.map-footer,
.footer-actions,
.selected-title,
.modal-heading,
.modal-actions {
  display: flex;
  align-items: center;
}

.brand-block { min-width: 0; gap: 12px; }

.brand-mark {
  width: 44px;
  height: 44px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 1px solid rgba(184, 236, 205, 0.3);
  border-radius: 13px;
  background: linear-gradient(145deg, #254539, #162923);
  color: var(--accent-strong);
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.08em;
  box-shadow: inset 0 1px rgba(255, 255, 255, 0.08);
}

.brand-copy { min-width: 0; }

.brand-copy label,
.eyebrow {
  display: block;
  margin-bottom: 2px;
  color: var(--muted-2);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.17em;
  text-transform: uppercase;
}

.brand-copy input,
.location-control input {
  width: 100%;
  border: 0;
  outline: 0;
  padding: 0;
  background: transparent;
  color: var(--ink);
  font-weight: 760;
}

.brand-copy input { font-size: 18px; text-overflow: ellipsis; }

.timer-strip {
  justify-self: center;
  width: min(100%, 650px);
  justify-content: center;
  gap: 13px;
}

.timer-label {
  display: block;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.timer-team {
  min-width: 118px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.timer-team-avatar {
  width: 35px;
  height: 35px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: #102019;
  font-size: 10px;
  font-weight: 950;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
}

.timer-team-copy { min-width: 0; }
.timer-team-copy small,
.timer-team-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer-team-copy small { color: var(--muted-2); font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
.timer-team-copy strong { max-width: 105px; margin-top: 2px; font-size: 11px; }

.timer-readout {
  min-width: 134px;
  padding-left: 17px;
  border-left: 1px solid var(--line-strong);
}

.timer-readout strong {
  display: block;
  font-variant-numeric: tabular-nums;
  font-size: 28px;
  line-height: 1.04;
  letter-spacing: 0.03em;
}

.timer-due .timer-readout strong,
.timer-due .timer-label { color: #ffd4cc; }
.timer-readout.due strong { color: #ff9b89; }
.timer-readout.warning strong { color: #f4c85e; }
.timer-actions { gap: 7px; }
.running-timers {
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--muted-2);
  font-size: 8px;
  font-weight: 800;
  white-space: nowrap;
}
.timer-empty { color: var(--muted); font-size: 11px; }
.top-actions { justify-content: flex-end; gap: 9px; }
.save-pill { white-space: nowrap; color: var(--muted); font-size: 10px; }
.save-pill.saved { color: var(--accent); }
.save-pill.local { color: var(--warning); }
.save-pill.error { color: var(--danger); }
.save-pill.saving { color: var(--warning); }

.offline-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 7px;
  border: 1px solid rgba(141, 208, 170, 0.26);
  border-radius: 7px;
  color: var(--accent);
  font-size: 8px;
  font-weight: 850;
  letter-spacing: .08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.button,
.icon-button,
.tool-button,
.text-button,
.round-add,
.team-card,
.status-grid button,
.timer-mode-switch button,
.duration-row button,
.warning-row button,
.timer-action,
.modal-close,
.color-row button { border: 0; cursor: pointer; }

.button {
  min-height: 38px;
  padding: 0 15px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 800;
}

.button.primary {
  color: #0c241a;
  background: var(--accent-strong);
  box-shadow: 0 6px 18px rgba(84, 181, 125, 0.2);
}

.button.ghost {
  border: 1px dashed var(--line-strong);
  background: rgba(255, 255, 255, 0.025);
  color: var(--muted);
}

.button.full { width: 100%; }
.alarm-button { min-width: 122px; background: #ff765f; color: #2a0b07; }

.icon-button {
  min-width: 36px;
  min-height: 36px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.icon-button.wide { min-width: auto; }

.workspace {
  height: calc(100dvh - 82px);
  min-height: 538px;
  display: grid;
  grid-template-columns: 292px minmax(0, 1fr);
  transition: grid-template-columns 220ms ease;
}

.focus-mode .workspace { grid-template-columns: 0 minmax(0, 1fr); }
.focus-mode .side-panel { transform: translateX(-100%); opacity: 0; }

.side-panel {
  min-width: 0;
  overflow-y: auto;
  border-right: 1px solid var(--line);
  background: #0d1916;
  transition: transform 220ms ease, opacity 180ms ease;
  scrollbar-width: thin;
  scrollbar-color: #385049 transparent;
}

.panel-section { padding: 18px; border-bottom: 1px solid var(--line); }

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
}

.section-heading h2,
.selected-title h3,
.modal-heading h2 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }

.round-add {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: var(--accent-strong);
  color: #0b2018;
  font-size: 24px;
  line-height: 1;
}

.team-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }

.team-card {
  width: 100%;
  min-height: 56px;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) 62px;
  align-items: center;
  gap: 10px;
  padding: 7px 11px 7px 7px;
  border: 1px solid transparent;
  border-radius: 13px;
  background: transparent;
  text-align: left;
}

.team-card.selected {
  border-color: var(--line-strong);
  background: rgba(218, 240, 231, 0.07);
  box-shadow: inset 3px 0 0 var(--accent);
}

.team-avatar {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: #102019;
  font-size: 11px;
  font-weight: 950;
  letter-spacing: 0.04em;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24);
}

.team-card-copy { min-width: 0; }
.team-card-copy strong, .team-card-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-card-copy strong { font-size: 12px; }
.team-card-copy small { margin-top: 3px; color: var(--muted); font-size: 10px; }

.team-card-side {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
}

.team-timer-chip {
  max-width: 62px;
  overflow: hidden;
  color: var(--muted-2);
  font-size: 9px;
  font-weight: 850;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.team-timer-chip.running { color: var(--accent-strong); }
.team-timer-chip.warning { color: #f4c85e; }
.team-timer-chip.due { color: var(--danger); }

.status-dot, .mini-dot { display: inline-block; border-radius: 99px; }
.status-dot { width: 8px; height: 8px; }
.mini-dot { width: 7px; height: 7px; flex: 0 0 auto; }
.status-ready { background: #7ee0a8 !important; }
.status-moving { background: #67b8e9 !important; }
.status-onsite { background: #f0bd4f !important; }
.status-paused { background: #7e8d87 !important; }

.selected-title { justify-content: space-between; gap: 12px; margin-bottom: 12px; }

.text-button {
  padding: 4px 0;
  background: transparent;
  color: var(--accent);
  font-size: 11px;
  font-weight: 750;
}
.text-button.danger { color: var(--danger); }

.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.status-grid button {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 33px;
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.025);
  color: var(--muted);
  font-size: 10px;
  text-align: left;
}

.status-grid button.active {
  border-color: rgba(184, 236, 205, 0.42);
  background: rgba(141, 208, 170, 0.1);
  color: var(--ink);
}

.team-timer-panel {
  margin-top: 12px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(0,0,0,.12);
}

.team-timer-panel.due {
  border-color: rgba(255, 128, 108, .48);
  box-shadow: inset 0 0 0 1px rgba(255, 128, 108, .07);
}

.team-timer-panel.warning {
  border-color: rgba(233, 185, 73, .42);
  box-shadow: inset 0 0 0 1px rgba(233, 185, 73, .06);
}

.team-timer-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .09em;
}
.team-timer-heading b { color: var(--accent); font-size: 8px; }
.team-timer-panel.warning .team-timer-heading b { color: #f4c85e; }
.team-timer-panel.due .team-timer-heading b { color: var(--danger); }

.timer-mode-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  padding: 3px;
  border-radius: 9px;
  background: rgba(255,255,255,.035);
}

.timer-mode-switch button {
  min-height: 30px;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 9px;
  font-weight: 750;
}
.timer-mode-switch button span { margin-right: 3px; }
.timer-mode-switch button.active { background: rgba(141,208,170,.14); color: var(--accent-strong); }

.team-timer-readout {
  padding: 11px 0 9px;
  color: var(--ink);
  font-size: 28px;
  font-weight: 780;
  line-height: 1;
  letter-spacing: .04em;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.team-timer-panel.due .team-timer-readout { color: var(--danger); }

.duration-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 8px;
}
.duration-row > span { margin-right: auto; color: var(--muted-2); font-size: 8px; text-transform: uppercase; font-weight: 800; }
.duration-row button {
  min-height: 25px;
  padding: 0 6px;
  border-radius: 6px;
  background: rgba(255,255,255,.04);
  color: var(--muted);
  font-size: 8px;
  font-weight: 750;
}
.duration-row button.active { background: rgba(141,208,170,.14); color: var(--accent-strong); }
.duration-row label {
  height: 25px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 5px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted-2);
  font-size: 8px;
}
.duration-row input {
  width: 28px;
  border: 0;
  outline: 0;
  padding: 0;
  background: transparent;
  color: var(--ink);
  font-size: 9px;
  text-align: center;
}

.warning-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: -1px 0 8px;
  padding-top: 7px;
  border-top: 1px solid var(--line);
}
.warning-row > span { margin-right: auto; color: var(--muted-2); font-size: 8px; font-weight: 800; }
.warning-row button {
  min-height: 25px;
  padding: 0 7px;
  border-radius: 6px;
  background: rgba(255,255,255,.04);
  color: var(--muted);
  font-size: 8px;
  font-weight: 750;
}
.warning-row button.active { background: rgba(233,185,73,.16); color: #f4c85e; }

.team-timer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.timer-action {
  min-height: 31px;
  border-radius: 8px;
  font-size: 9px;
  font-weight: 800;
}
.timer-action.start { background: var(--accent-strong); color: #0c241a; }
.timer-action.pause { background: #e9b949; color: #261b04; }
.timer-action.reset { border: 1px solid var(--line); background: rgba(255,255,255,.035); color: var(--muted); }

.marker-settings {
  margin-top: 9px;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(255,255,255,.018);
}
.marker-settings > div { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 9px; font-weight: 750; }
.marker-settings > div b { color: var(--accent-strong); font-size: 9px; font-variant-numeric: tabular-nums; }
.marker-settings label { display: grid; grid-template-columns: 12px minmax(0,1fr) 16px; align-items: center; gap: 7px; margin-top: 8px; color: var(--muted-2); }
.marker-settings small { font-size: 8px; }
.marker-settings strong { font-size: 15px; }
.marker-settings input { width: 100%; accent-color: var(--accent); }

.team-note {
  margin: 11px 0 0;
  padding: 9px 10px;
  border-left: 2px solid var(--accent);
  background: rgba(141, 208, 170, 0.06);
  color: var(--muted);
  font-size: 10px;
  line-height: 1.45;
}

.history-list { list-style: none; margin: 0; padding: 0; }
.history-list li {
  display: grid;
  grid-template-columns: 39px minmax(0, 1fr);
  gap: 9px;
  padding: 6px 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.35;
}
.history-list time { color: var(--muted-2); font-variant-numeric: tabular-nums; }

.map-stage {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: 54px minmax(0, 1fr) 34px;
  padding: 0 14px;
  background: #121f1b;
}

.map-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.location-control { display: flex; align-items: center; min-width: 180px; max-width: 340px; gap: 7px; }
.location-pin { color: var(--accent); }
.location-control input { font-size: 12px; }
.toolbar-group { gap: 6px; }

.tool-button {
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.035);
  color: var(--muted);
  font-size: 9px;
  font-weight: 750;
}
.tool-button.active { border-color: rgba(141, 208, 170, 0.4); color: var(--accent-strong); }
.tool-button.accent { background: var(--accent-strong); color: #102019; }

.map-canvas {
  position: relative;
  min-height: 0;
  overflow: hidden;
  border: 1px solid rgba(217, 236, 227, 0.16);
  border-radius: 18px;
  background: radial-gradient(circle at 76% 18%, rgba(101, 142, 124, 0.18), transparent 25%), radial-gradient(circle at 25% 75%, rgba(55, 90, 75, 0.24), transparent 28%), #22332d;
  box-shadow: 0 20px 55px rgba(0, 0, 0, 0.27), inset 0 1px rgba(255, 255, 255, 0.03);
  touch-action: none;
  user-select: none;
}

.map-canvas.with-grid::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background-image: linear-gradient(rgba(218, 239, 229, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(218, 239, 229, 0.07) 1px, transparent 1px);
  background-size: 8.333% 10%;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,.42));
}

.map-background {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  pointer-events: none;
  filter: saturate(0.72) contrast(1.08) brightness(0.73);
}
.map-background.fit-cover { object-fit: cover; }
.map-background.fit-contain { object-fit: contain; background: #17221f; }

.map-mode-switch { display: flex; gap: 4px; padding: 3px; border-radius: 9px; background: rgba(255,255,255,.035); }
.map-mode-switch button {
  min-height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 9px;
  font-weight: 750;
  cursor: pointer;
}
.map-mode-switch button.active { background: rgba(141,208,170,.16); color: var(--accent-strong); }

.location-search { display: flex; align-items: center; gap: 6px; min-width: 150px; max-width: 260px; flex: 1 1 auto; }
.location-search input {
  width: 100%;
  height: 30px;
  border: 1px solid var(--line);
  outline: 0;
  border-radius: 8px;
  padding: 0 9px;
  background: rgba(255,255,255,.035);
  color: var(--ink);
  font-size: 10px;
}
.location-search input:focus { border-color: rgba(141,208,170,.5); }

.leaflet-host { position: absolute; inset: 0; z-index: 1; background: #17221f; }
.leaflet-host .leaflet-tile-pane { filter: saturate(0.75) contrast(1.05) brightness(0.82); }
.leaflet-host .leaflet-control-attribution {
  background: rgba(8, 18, 15, 0.72) !important;
  color: var(--muted) !important;
  font-size: 9px !important;
}
.leaflet-host .leaflet-control-attribution a { color: var(--accent) !important; }
.leaflet-host .leaflet-control-zoom a {
  background: rgba(8, 18, 15, 0.82) !important;
  color: var(--ink) !important;
  border-color: rgba(220, 238, 230, 0.16) !important;
}

.tl-marker-icon { background: transparent; border: 0; }

.map-live-banner {
  position: absolute;
  left: 50%;
  top: 14px;
  z-index: 9;

    if (databasePromise) return databasePromise;
    databasePromise = new Promise(function (resolve, reject) {
      var request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = function () {
        if (!request.result.objectStoreNames.contains(DB_STORE)) {
          request.result.createObjectStore(DB_STORE);
        }
      };
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error || new Error("Datenbankfehler")); };
    });
    return databasePromise;
  }

  async function readFromDatabase() {
    var db = await openDatabase();
    return new Promise(function (resolve, reject) {
      var transaction = db.transaction(DB_STORE, "readonly");
      var request = transaction.objectStore(DB_STORE).get("state");
      request.onsuccess = function () { resolve(request.result || null); };
      request.onerror = function () { reject(request.error || new Error("Lesefehler")); };
    });
  }

  async function writeToDatabase(value) {
    var db = await openDatabase();
    return new Promise(function (resolve, reject) {
      var transaction = db.transaction(DB_STORE, "readwrite");
      transaction.objectStore(DB_STORE).put(value, "state");
      transaction.oncomplete = function () { resolve(); };
      transaction.onerror = function () {
        reject(transaction.error || new Error("Speicherfehler"));
      };
      transaction.onabort = function () {
        reject(transaction.error || new Error("Speichern abgebrochen"));
      };
    });
  }

  async function loadSavedState() {
    var loaded = null;
    try {
      loaded = await readFromDatabase();
    } catch (databaseError) {
      try {
        var localRaw = window.localStorage.getItem(STORAGE_KEY);
        loaded = localRaw ? JSON.parse(localRaw) : null;
      } catch (localError) {
        loaded = null;
      }
    }

    var normalized = normalizeLoadedState(loaded);
    if (normalized) board = normalized;
    hydrated = true;
    storageState = "saved";
    render();
    if (!normalized) persistSoon();
  }

  function persistSoon() {
    if (!hydrated) return;
    window.clearTimeout(saveTimer);
    storageState = "saving";
    updateStorageDom();
    saveTimer = window.setTimeout(saveNow, 160);
  }

  async function saveNow() {
    var snapshot = clone(board);
    try {
      await writeToDatabase(snapshot);
      storageState = "saved";
      ui.storageWarning = false;
    } catch (databaseError) {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
        storageState = "local";
        ui.storageWarning = false;
      } catch (localError) {
        storageState = "error";
        ui.storageWarning = true;
      }
    }
    updateStorageDom();

  function getAudioContext() {
    try {
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === "suspended") {
        audioContext.resume().catch(function () {});
      }
      return audioContext;
    } catch (error) {
      return null;
    }
  }

  function signalTimerAlarm() {
    if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 500]);
    var context = getAudioContext();
    if (!context) return;
    try {
      [0, 0.28, 0.56].forEach(function (offset) {
        var oscillator = context.createOscillator();
        var gain = context.createGain();
        oscillator.frequency.value = 740;
        gain.gain.setValueAtTime(0.001, context.currentTime + offset);
        gain.gain.exponentialRampToValueAtTime(
          0.17,
          context.currentTime + offset + 0.02
        );
        gain.gain.exponentialRampToValueAtTime(
          0.001,
          context.currentTime + offset + 0.2
        );
        oscillator.connect(gain).connect(context.destination);
        oscillator.start(context.currentTime + offset);
        oscillator.stop(context.currentTime + offset + 0.22);
      });
    } catch (error) {
      return;
    }
  }

  function initLiveMap() {
    var host = document.getElementById("leaflet-host");
    if (!host || !hasLeaflet()) return;

    var now = Date.now();
    board.teams.forEach(ensureTeamGeo);

    var map = window.L.map(host, {
      center: [board.liveMap.lat, board.liveMap.lng],
      zoom: board.liveMap.zoom,
      zoomControl: true,
      attributionControl: true
    });
    window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap-Mitwirkende"
    }).addTo(map);

    liveMapInstance = map;
    liveMapMarkers = {};

    board.teams.forEach(function (team) {
      var marker = window.L.marker([team.lat, team.lng], {
        icon: teamDivIcon(team, now),
        draggable: true
      }).addTo(map);
      marker.on("click", function () {
        board.selectedTeamId = team.id;
        render();
        persistSoon();
      });
      marker.on("dblclick", function (domEvent) {
        window.L.DomEvent.stopPropagation(domEvent);
        board.selectedTeamId = team.id;
        ui.editorOpen = true;
        render();
      });
      marker.on("dragend", function () {
        var position = marker.getLatLng();
        var current = findTeam(team.id);
        if (!current) return;
        current.lat = clamp(position.lat, -90, 90);
        current.lng = clamp(position.lng, -180, 180);
        current.movedAt = Date.now();
        board.selectedTeamId = current.id;
        addHistory(current.name + " auf der Live-Karte versetzt", current.id);
        render();
        persistSoon();
      });
      liveMapMarkers[team.id] = marker;
    });

    map.on("moveend zoomend", function () {
      var center = map.getCenter();
      board.liveMap.lat = center.lat;
      board.liveMap.lng = center.lng;
      board.liveMap.zoom = map.getZoom();
      persistSoon();
    });
  }

  function refreshLiveMapMarkers(now) {
    board.teams.forEach(function (team) {
      var marker = liveMapMarkers[team.id];
      if (!marker) return;
      marker.setIcon(teamDivIcon(team, now));
    });
  }

  function searchLiveLocation(query) {
    if (!query || !query.trim()) return;
    if (!navigator.onLine) {
      showToast("Ortssuche benötigt eine Internetverbindung.", 3200);
      return;
    }
    showToast("Suche „" + query + "“ …", 2000);
    fetch(
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(query)
    )
      .then(function (response) { return response.json(); })
      .then(function (results) {
        if (!results || !results[0]) {
          showToast("Kein Ort gefunden.", 2800);
          return;
        }
        board.liveMap.lat = Number(results[0].lat);
        board.liveMap.lng = Number(results[0].lon);
        board.liveMap.zoom = 15;
        render();
        persistSoon();
      })
      .catch(function () {
        showToast("Suche fehlgeschlagen (offline oder Dienst nicht erreichbar).", 3200);
      });
  }

  function useMyLocation() {
    if (!("geolocation" in navigator)) {
      showToast("Standortabfrage wird von diesem Gerät nicht unterstützt.", 3200);
      return;
    }
    showToast("Standort wird ermittelt …", 2200);
    navigator.geolocation.getCurrentPosition(
      function (position) {
        board.liveMap.lat = position.coords.latitude;
        board.liveMap.lng = position.coords.longitude;
        board.liveMap.zoom = 16;
        render();
        persistSoon();
      },
      function () {
        showToast("Standort konnte nicht ermittelt werden.", 3200);
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }

    if (!ui.editorOpen || !team) return "";
    var result = [];
    result.push(
      '<div class="modal-backdrop" data-action="close-modal">',
      '<section class="team-editor">',
      '<div class="modal-heading"><div><span class="eyebrow">Teamdaten</span><h2>' + esc(team.name) + '</h2></div>',
      '<button class="modal-close" data-action="close-modal" aria-label="Schließen">×</button></div>',
      '<div class="form-grid">',
      '<label><span>Teamname</span><input data-field="team-name" data-team-id="' + esc(team.id) + '" value="' + esc(team.name) + '"></label>',
      '<label><span>Kürzel auf der Karte</span><input data-field="team-code" data-team-id="' + esc(team.id) + '" maxlength="3" value="' + esc(team.code) + '"></label>',
      '</div>',
      '<fieldset class="color-field"><legend>Teamfarbe</legend><div class="color-row">'
    );
    TEAM_COLORS.forEach(function (color) {
      result.push(
        '<button class="' + (team.color === color ? 'selected' : '') + '" style="background:' + color + '" data-action="set-color" data-team-id="' + esc(team.id) + '" data-color="' + color + '" aria-label="Farbe ' + color + '"></button>'
      );
    });
    result.push(
      '</div></fieldset>',
      '<label class="full-label"><span>Mitglieder <small>eine Person pro Zeile</small></span>',
      '<textarea rows="5" data-field="team-members" data-team-id="' + esc(team.id) + '" placeholder="Vorname Nachname">' + esc(team.members.join("\n")) + '</textarea></label>',
      '<label class="full-label"><span>Auftrag / Notiz</span>',
      '<textarea rows="3" data-field="team-note" data-team-id="' + esc(team.id) + '" placeholder="z. B. Nordzugang sichern">' + esc(team.note) + '</textarea></label>',
      '<div class="modal-actions">',
      '<button class="text-button danger" data-action="delete-team" data-team-id="' + esc(team.id) + '">Team löschen</button>',
      '<button class="button primary" data-action="close-modal">Fertig</button>',

  function renderHistoryModal() {
    if (!ui.historyOpen) return "";
    var result = [];
    result.push(
      '<div class="modal-backdrop" data-action="close-modal">',
      '<section class="history-modal">',
      '<div class="modal-heading"><div><span class="eyebrow">Chronologisch</span><h2>Lageverlauf</h2></div>',
      '<button class="modal-close" data-action="close-modal" aria-label="Schließen">×</button></div>',
      '<ol class="history-list large">'
    );
    board.history.forEach(function (entry) {
      result.push(
        '<li><time>' + esc(formatTime(entry.time)) + '</time><span>' + esc(entry.text) + '</span></li>'
      );
    });
    result.push(
      '</ol><div class="modal-actions">',
      '<button class="text-button danger" data-action="clear-history">Verlauf leeren</button>',
      '<button class="button primary" data-action="close-modal">Schließen</button>',
      '</div></section></div>'
    );
    return result.join("");
  }

  function render() {
    var now = Date.now();
    var selected = selectedTeam();
    var result = [];
    result.push('<div class="app-shell' + (ui.focusMode ? ' focus-mode' : '') + '">');
    result.push(renderTopbar(selected, now));
    result.push('<div class="workspace"><aside class="side-panel">');
    result.push(renderRoster(now));
    result.push(renderSelectedPanel(selected, now));
    result.push(renderHistoryPreview());
    result.push('</aside>');
    result.push(renderMap(now));
    result.push('</div>');
    result.push(renderEditor(selected));
    result.push(renderHistoryModal());
    result.push('<div id="toast-host"></div></div>');
    root.innerHTML = result.join("");
    updateStorageDom();
    renderToast();
    teardownLiveMap();
    if (board.mapMode === "live") initLiveMap();
    updateTimerDom(now);
  }

  function updateTimerDom(now) {
    var teamById = {};
    board.teams.forEach(function (team) { teamById[team.id] = team; });
    Array.prototype.forEach.call(
      document.querySelectorAll("[data-timer-value]"),
      function (element) {
        var team = teamById[element.getAttribute("data-timer-value")];
        if (!team) return;
        var view = timerView(team, now);
        element.textContent = formatClock(view.displayMs, team.timer.mode === "down");
      }
    );
    Array.prototype.forEach.call(
      document.querySelectorAll("[data-team-chip]"),
      function (element) {
        var team = teamById[element.getAttribute("data-team-chip")];
        if (!team) return;
        var view = timerView(team, now);
        element.className = "team-timer-chip"
          + (view.running ? " running" : "")
          + (view.warning ? " warning" : "")
          + (view.due ? " due" : "");
        element.textContent = (team.timer.mode === "down" ? "↓ " : "↑ ")
          + formatClock(view.displayMs, team.timer.mode === "down");
      }
    );
    Array.prototype.forEach.call(
      document.querySelectorAll("[data-marker-team]"),
      function (element) {
        var team = teamById[element.getAttribute("data-marker-team")];
        if (!team) return;
        var view = timerView(team, now);
        element.classList.toggle("timer-warning", view.warning);
        element.classList.toggle("timer-expired", view.due);
      }
    );
    Array.prototype.forEach.call(
      document.querySelectorAll("[data-timer-detail]"),
      function (element) {
        var team = teamById[element.getAttribute("data-timer-detail")];
        if (!team) return;
        var view = timerView(team, now);
        element.textContent = view.due
          ? "Abgelaufen"
          : view.warning
            ? "Letzte " + team.timer.warningMinutes + " min"
            : STATUS_META[team.status].label + " · " + team.members.length + " Pers.";
      }
    );
    Array.prototype.forEach.call(
      document.querySelectorAll("[data-team-timer-panel]"),
      function (element) {
        var team = teamById[element.getAttribute("data-team-timer-panel")];
        if (!team) return;
        var view = timerView(team, now);
        element.classList.toggle("warning", view.warning);
        element.classList.toggle("due", view.due);
      }
    );
    Array.prototype.forEach.call(
      document.querySelectorAll("[data-timer-state]"),
      function (element) {
        var team = teamById[element.getAttribute("data-timer-state")];
        if (!team) return;
        var view = timerView(team, now);
        element.textContent = view.due
          ? "Abgelaufen"
          : view.warning
            ? "Vorwarnung"
            : view.running
              ? "Läuft"
              : "Bereit";
      }
    );

    var selected = selectedTeam();
    var selectedTimer = selected ? timerView(selected, now) : null;
    var topReadout = document.querySelector("[data-top-readout]");
    var topLabel = document.querySelector("[data-top-timer-label]");
    if (topReadout && topLabel && selected && selectedTimer) {
      topReadout.classList.toggle("warning", selectedTimer.warning);
      topReadout.classList.toggle("due", selectedTimer.due);
      topLabel.textContent = selectedTimer.due
        ? "ABGELAUFEN"
        : selectedTimer.warning
          ? "LETZTE " + selected.timer.warningMinutes + " MIN"
          : selected.timer.mode === "down"
            ? "Ablaufend"
            : "Auflaufend";
    }
    var anyDue = board.teams.some(function (team) {
      return timerView(team, now).due;
    });
    var topbar = document.querySelector(".topbar");
    if (topbar) topbar.classList.toggle("timer-due", anyDue);
    var running = board.teams.filter(function (team) {
      return timerView(team, now).running;
    }).length;
    var runningLabel = document.querySelector("[data-running-count]");
    if (runningLabel) runningLabel.textContent = running + " aktiv";

    if (board.mapMode === "live" && liveMapInstance) refreshLiveMapMarkers(now);
  }

  function createTeam() {
    var number = board.teams.length + 1;
    var id = createId("team");
    var team = {
      id: id,
      name: "Team " + number,
      code: ("T" + number).slice(0, 3),
      color: TEAM_COLORS[board.teams.length % TEAM_COLORS.length],
      members: [],
      status: "bereit",
      note: "",
      x: 50,
      y: 50,
      lat: null,
      lng: null,
      movedAt: Date.now(),
      markerScale: 1,
      timer: {
        mode: "down",
        durationMinutes: 30,
        warningMinutes: 5,
        startedAt: null,
        elapsedMs: 0
      }
    };
    board.teams.push(team);
    board.selectedTeamId = id;
    addHistory(team.name + " angelegt", id);
    ui.editorOpen = true;
    render();
    persistSoon();
  }

  function removeTeam(teamId) {
    var team = findTeam(teamId);
    if (!team) return;
    if (!window.confirm(team.name + " wirklich entfernen?")) return;
    board.teams = board.teams.filter(function (item) {
      return item.id !== teamId;
    });
    if (board.selectedTeamId === teamId) {
      board.selectedTeamId = board.teams[0] ? board.teams[0].id : null;
    }
    addHistory(team.name + " entfernt");
    ui.editorOpen = false;
    render();
    persistSoon();
  }

  function startTeamTimer(teamId) {
    var team = findTeam(teamId);
    if (!team) return;
    getAudioContext();
    var now = Date.now();
    var elapsed = timerElapsedMs(team.timer, now);
    var duration = team.timer.durationMinutes * 60000;
    team.timer.elapsedMs = team.timer.mode === "down" && elapsed >= duration
      ? 0
      : elapsed;
    team.timer.startedAt = now;
    addHistory(
      team.name + ": " + (team.timer.mode === "down" ? "Countdown" : "Stoppuhr") + " gestartet",
      team.id
    );
    render();
    persistSoon();
  }

  function pauseTeamTimer(teamId) {
    var team = findTeam(teamId);
    if (!team) return;
    var elapsed = timerElapsedMs(team.timer, Date.now());
    team.timer.elapsedMs = team.timer.mode === "down"
      ? Math.min(elapsed, team.timer.durationMinutes * 60000)
      : elapsed;
    team.timer.startedAt = null;
    addHistory(team.name + ": Timer pausiert", team.id);
    render();
    persistSoon();
  }

  function resetTeamTimer(teamId) {
    var team = findTeam(teamId);
    if (!team) return;
    team.timer.startedAt = null;
    team.timer.elapsedMs = 0;
    addHistory(team.name + ": Timer zurückgesetzt", team.id);
    render();
    persistSoon();
  }

  function setTimerMode(teamId, mode) {
    var team = findTeam(teamId);
    if (!team || (mode !== "down" && mode !== "up") || team.timer.mode === mode) {
      return;
    }
    team.timer.mode = mode;
    team.timer.startedAt = null;
    team.timer.elapsedMs = 0;
    addHistory(
      team.name + ": Timer auf " + (mode === "down" ? "Ablaufen" : "Auflaufen") + " gestellt",
      team.id
    );
    render();
    persistSoon();
  }

  function setTimerDuration(teamId, minutes) {
    var team = findTeam(teamId);
    if (!team) return;
    team.timer.durationMinutes = clamp(Math.round(Number(minutes) || 1), 1, 240);
    team.timer.startedAt = null;
    team.timer.elapsedMs = 0;
    render();
    persistSoon();
  }

  function setTimerWarning(teamId, minutes) {
    var team = findTeam(teamId);
    if (!team) return;
    team.timer.warningMinutes = clamp(Math.round(Number(minutes) || 0), 0, 60);
    render();
    persistSoon();
  }

  function tick() {
    var now = Date.now();
    var newlyDue = board.teams.filter(function (team) {
      return team.timer.mode === "down"
        && team.timer.startedAt !== null
        && timerElapsedMs(team.timer, now) >= team.timer.durationMinutes * 60000;
    });
    if (newlyDue.length) {
      newlyDue.forEach(function (team) {
        team.timer.startedAt = null;
        team.timer.elapsedMs = team.timer.durationMinutes * 60000;
        addHistory(team.name + ": Timer abgelaufen", team.id);
      });
      board.selectedTeamId = newlyDue[0].id;
      signalTimerAlarm();
      showToast(
        newlyDue.length === 1
          ? newlyDue[0].name + ": Timer abgelaufen"
          : newlyDue.length + " Team-Timer abgelaufen",
        4200
      );
      render();
      persistSoon();
      return;
    }
    updateTimerDom(now);
  }

  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(reader.error || new Error("Lesefehler")); };
      reader.readAsDataURL(file);
    });
  }

  function loadImage(source) {
    return new Promise(function (resolve, reject) {
      var image = new Image();
      image.onload = function () { resolve(image); };
      image.onerror = function () { reject(new Error("Bild konnte nicht geöffnet werden")); };
      image.src = source;
    });
  }

  async function prepareBackground(file) {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) {
      throw new Error("Bitte eine Bilddatei auswählen.");
    }
    if (file.type === "image/svg+xml") {
      throw new Error("SVG wird nicht unterstützt. Bitte PNG oder JPG wählen.");
    }
    if (file.size > 30 * 1024 * 1024) {
      throw new Error("Das Bild darf höchstens 30 MB groß sein.");
    }
    var source = await readAsDataUrl(file);
    var image = await loadImage(source);
    var maxDimension = 2600;
    var scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
    if (scale === 1 && file.size <= 7 * 1024 * 1024 && safeImageData(source)) {
      return source;
    }
    var canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    var context = canvas.getContext("2d");
    if (!context) throw new Error("Bildverarbeitung ist nicht verfügbar.");
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.88);
  }

  async function uploadBackground(file) {
    showToast("Geländeplan wird lokal vorbereitet …", 5000);
    try {
      var dataUrl = await prepareBackground(file);
      board.backgroundDataUrl = dataUrl;
      board.backgroundName = file.name || "Geländeplan";
      addHistory("Geländeplan „" + board.backgroundName + "“ geladen");
      render();
      persistSoon();
      showToast("Geländeplan lokal gespeichert");
    } catch (error) {
      showToast(error && error.message ? error.message : "Bild konnte nicht geladen werden.", 4200);
    }
  }

  function exportBoard() {
    var backup = {
      app: "Teamlage Offline",
      version: 2,
      exportedAt: new Date().toISOString(),
      state: board
    };
    var blob = new Blob([JSON.stringify(backup, null, 2)], {
      type: "application/json"
    });
    var url = URL.createObjectURL(blob);
    var anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = "teamlage-vollsicherung-"
      + new Date().toISOString().slice(0, 10)
      + ".json";
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("Vollsicherung inklusive Geländeplan exportiert");
  }

  async function importBoard(file) {
    try {
      var parsed = JSON.parse(await file.text());
      var normalized = normalizeLoadedState(parsed);
      if (!normalized) throw new Error("Ungültige Sicherung");
      board = normalized;
      addHistory("Sicherung eingespielt");
      ui.editorOpen = false;
      ui.historyOpen = false;
      render();
      persistSoon();
      showToast("Sicherung erfolgreich eingespielt");
    } catch (error) {
      showToast("Diese Sicherung konnte nicht gelesen werden.", 4200);
    }
  }

  root.addEventListener("click", function (event) {
    var actionElement = event.target.closest("[data-action]");
    if (!actionElement) return;
    var action = actionElement.getAttribute("data-action");
    var teamId = actionElement.getAttribute("data-team-id");

    if (action === "close-modal") {
      if (actionElement.classList.contains("modal-backdrop") && event.target !== actionElement) {
        return;
      }
      ui.editorOpen = false;
      ui.historyOpen = false;
      render();
      return;
    }
    if (Date.now() < suppressClickUntil && action === "select-team") return;

    if (action === "add-team") createTeam();
    if (action === "select-team" && findTeam(teamId)) {
      board.selectedTeamId = teamId;
      render();
      persistSoon();
    }
    if (action === "open-editor" && findTeam(teamId)) {
      board.selectedTeamId = teamId;
      ui.editorOpen = true;
      render();
    }
    if (action === "delete-team") removeTeam(teamId);
    if (action === "set-color") {
      var colorTeam = findTeam(teamId);
      var color = actionElement.getAttribute("data-color");
      if (colorTeam && safeColor(color, null)) {
        colorTeam.color = color;
        render();
        persistSoon();
      }
    }
    if (action === "set-status") {
      var statusTeam = findTeam(teamId);
      var status = actionElement.getAttribute("data-status");
      if (statusTeam && STATUS_META[status]) {
        statusTeam.status = status;
        addHistory(statusTeam.name + ": " + STATUS_META[status].label, statusTeam.id);
        render();
        persistSoon();
      }
    }
    if (action === "timer-start") startTeamTimer(teamId);
    if (action === "timer-pause") pauseTeamTimer(teamId);
    if (action === "timer-reset") resetTeamTimer(teamId);
    if (action === "timer-mode") {
      setTimerMode(teamId, actionElement.getAttribute("data-mode"));
    }
    if (action === "timer-duration") {
      setTimerDuration(teamId, actionElement.getAttribute("data-minutes"));
    }
    if (action === "timer-warning") {
      setTimerWarning(teamId, actionElement.getAttribute("data-minutes"));
    }
    if (action === "set-map-mode") {
      var mode = actionElement.getAttribute("data-mode") === "live" ? "live" : "image";
      if (mode !== board.mapMode) {
        board.mapMode = mode;
        addHistory(mode === "live" ? "Auf Live-Karte gewechselt" : "Auf eigenes Kartenbild gewechselt");
        render();
        persistSoon();
      }
    }
    if (action === "use-my-location") useMyLocation();
    if (action === "toggle-grid") {
      board.showGrid = !board.showGrid;
      render();
      persistSoon();
    }
    if (action === "toggle-fit") {
      board.mapFit = board.mapFit === "cover" ? "contain" : "cover";
      render();
      persistSoon();
    }
    if (action === "choose-background") {
      var backgroundInput = document.getElementById("background-input");
      if (backgroundInput) backgroundInput.click();
    }
    if (action === "remove-background") {
      if (window.confirm("Geländeplan wirklich entfernen?")) {
        board.backgroundDataUrl = null;
        board.backgroundName = null;
        addHistory("Geländeplan entfernt");
        render();
        persistSoon();
      }
    }
    if (action === "export-board") exportBoard();
    if (action === "choose-import") {
      var importInput = document.getElementById("import-input");
      if (importInput) importInput.click();
    }
    if (action === "toggle-focus") {
      ui.focusMode = !ui.focusMode;
      render();
    }
    if (action === "open-history") {
      ui.historyOpen = true;
      render();
    }
    if (action === "clear-history") {
      board.history = [{
        id: createId("log"),
        teamId: null,
        text: "Lageverlauf geleert",
        time: Date.now()
      }];
      render();
      persistSoon();
    }
  });

  root.addEventListener("submit", function (event) {
    var form = event.target.closest("[data-action='search-location-form']");
    if (!form) return;
    event.preventDefault();
    var input = form.querySelector("[data-field='location-search']");
    if (input) searchLiveLocation(input.value);
  });

  root.addEventListener("dblclick", function (event) {
    var teamElement = event.target.closest("[data-team-id]");
    if (!teamElement) return;
    var teamId = teamElement.getAttribute("data-team-id");
    if (!findTeam(teamId)) return;
    board.selectedTeamId = teamId;
    ui.editorOpen = true;
    render();
  });

  root.addEventListener("input", function (event) {
    var input = event.target;
    var field = input.getAttribute && input.getAttribute("data-field");
    if (!field) return;
    var team = findTeam(input.getAttribute("data-team-id"));
    if (field === "event-name") {
      board.eventName = safeText(input.value, "", 120);
      persistSoon();
    }
    if (field === "location-name") {
      board.locationName = safeText(input.value, "", 160);
      persistSoon();
    }
    if (field === "team-name" && team) {
      team.name = safeText(input.value, "", 100);
      persistSoon();
    }
    if (field === "team-code" && team) {
      input.value = input.value.toUpperCase().slice(0, 3);
      team.code = input.value;
      persistSoon();
    }
    if (field === "team-members" && team) {
      team.members = input.value.split("\n").map(function (name) {
        return safeText(name, "", 100).trim();
      }).filter(Boolean).slice(0, 50);
      persistSoon();
    }
    if (field === "team-note" && team) {
      team.note = safeText(input.value, "", 1000);
      persistSoon();
    }
    if (field === "marker-scale" && team) {
      team.markerScale = clamp(Number(input.value) || 1, 0.8, 1.8);
      var scaleLabel = document.querySelector("[data-scale-label]");
      if (scaleLabel) scaleLabel.textContent = Math.round(team.markerScale * 100) + " %";
      var marker = Array.prototype.find.call(
        document.querySelectorAll("[data-marker-team]"),
        function (element) {
          return element.getAttribute("data-marker-team") === team.id;
        }
      );
      if (marker) {
        marker.style.transform = "translate(-25px,-29px) scale(" + team.markerScale + ")";
      }
      persistSoon();
    }
  });

  root.addEventListener("change", function (event) {
    var input = event.target;
    if (input.id === "background-input" && input.files && input.files[0]) {
      uploadBackground(input.files[0]);
      input.value = "";
      return;
    }
    if (input.id === "import-input" && input.files && input.files[0]) {
      importBoard(input.files[0]);
      input.value = "";
      return;
    }
    var field = input.getAttribute && input.getAttribute("data-field");
    if (field === "timer-duration") {
      setTimerDuration(input.getAttribute("data-team-id"), input.value);
      return;
    }
    if (
      field === "team-name"
      || field === "team-code"
      || field === "team-members"
      || field === "team-note"
      || field === "marker-scale"
    ) {
      render();
    }
  });

  root.addEventListener("pointerdown", function (event) {
    var marker = event.target.closest("[data-marker-team]");
    var map = document.getElementById("map-canvas");
    if (!marker || !map) return;
    var teamId = marker.getAttribute("data-marker-team");
    if (!findTeam(teamId)) return;
    event.preventDefault();
    marker.setPointerCapture(event.pointerId);
    drag = {
      marker: marker,
      map: map,
      teamId: teamId,
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      moved: false
    };
  });

  root.addEventListener("pointermove", function (event) {
    if (!drag || drag.pointerId !== event.pointerId) return;
    event.preventDefault();
    var rect = drag.map.getBoundingClientRect();
    var x = clamp(((event.clientX - rect.left) / rect.width) * 100, 3, 97);
    var y = clamp(((event.clientY - rect.top) / rect.height) * 100, 4, 96);
    if (
      Math.abs(event.clientX - drag.startX) > 4
      || Math.abs(event.clientY - drag.startY) > 4
    ) {
      drag.moved = true;
    }
    var team = findTeam(drag.teamId);
    if (!team) return;
    team.x = x;
    team.y = y;
    drag.marker.style.left = x + "%";
    drag.marker.style.top = y + "%";
    var timerBadge = drag.marker.querySelector(".marker-timer");
    if (timerBadge) timerBadge.classList.toggle("align-left", x > 66);
  });

  function finishDrag(event) {
    if (!drag || drag.pointerId !== event.pointerId) return;
    var team = findTeam(drag.teamId);
    if (team) {
      board.selectedTeamId = team.id;
      if (drag.moved) {
        team.movedAt = Date.now();
        addHistory(team.name + " auf der Karte versetzt", team.id);
        suppressClickUntil = Date.now() + 500;
      }
    }
    drag = null;
    render();
    persistSoon();
  }

  root.addEventListener("pointerup", finishDrag);
  root.addEventListener("pointercancel", finishDrag);

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) tick();
  });
  window.addEventListener("pagehide", function () {
    if (hydrated) saveNow();
  });

  render();
  loadSavedState();
  window.setInterval(tick, 400);
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        /* Läuft weiterhin normal, nur ohne Installierbarkeit/Precache. */
      });
    });
  }
</script>
</body>
